name: tiktok-traffic-admin
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: traffic
      DB_USER: traffic
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}
      ADMIN_USER: ${ADMIN_USER:?Required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: ${AI_PROVIDER:-manual}
      AI_MODEL: ${AI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-20}
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  redis:
    image: redis:7-bookworm
    profiles: [jobs, integrations]
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redisdata:/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  worker:
    image: tiktok-traffic-admin-app
    profiles: [jobs]
    command: [celery, -A, app.worker.celery, worker, --loglevel=WARNING, --concurrency=1]
    environment: &job_env
      DB_HOST: db
      DB_NAME: traffic
      DB_USER: traffic
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      app: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  scheduler:
    image: tiktok-traffic-admin-app
    profiles: [jobs]
    command: [celery, -A, app.worker.celery, beat, --loglevel=WARNING, --schedule=/tmp/celerybeat-schedule]
    environment: *job_env
    depends_on:
      app: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
  telegram-bot:
    image: tiktok-traffic-admin-app
    profiles: [integrations]
    command: [python, -m, app.bot]
    environment: *job_env
    depends_on:
      app: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: 'on-failure:3'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: '10m', max-file: '3'}
volumes:
  pgdata:
  redisdata:
