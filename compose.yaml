name: tiktok-traffic-admin
services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: traffic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic -d traffic"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: traffic
      DB_USER: traffic
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/init_env.py}
      ADMIN_USER: ${ADMIN_USER:?Required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Required}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  pgdata:
